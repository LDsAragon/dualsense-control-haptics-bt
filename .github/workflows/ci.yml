name: CI

# En cada cambio: pruebas (Linux) y compilación del .exe con su autoprueba (Windows limpio).
# Al publicar una release en GitHub (con cualquier nombre de etiqueta), le adjunta el .exe.
# A mano (Actions > CI > Run workflow) se puede adjuntar a una release que ya existe.
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Etiqueta de una release existente a la que adjuntar el .exe (vacío = solo compilar)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  pruebas:
    name: Pruebas (protocolo y modificaciones de vDS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libopus-dev zlib1g-dev
          pip install numpy scipy soundfile hidapi pytest

      - name: Pruebas de Python
        run: python -m pytest -v tests

      - name: Pruebas contra el código real de vDS
        run: bash tests/vds/run.sh "$RUNNER_TEMP/vds-test"

  windows:
    name: Compilar DualSenseControl.exe
    needs: pruebas
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: vDS con nuestras modificaciones
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $commit = (Get-Content vds-mods/VDS_COMMIT -TotalCount 1).Trim()
          $vds = Join-Path $env:RUNNER_TEMP "vds"
          git -c core.autocrlf=false clone -q https://github.com/hurryman2212/vds.git $vds
          git -C $vds -c advice.detachedHead=false checkout -q $commit
          foreach ($p in Get-ChildItem vds-mods -Filter *.patch | Sort-Object Name) {
            git -C $vds apply --check $p.FullName
            git -C $vds apply $p.FullName
            Write-Host "aplicado: $($p.Name)"
          }
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT "scripts\buildsystems\vcpkg.cmake"
          cmake -S $vds -B "$vds\build\windows" "-DCMAKE_TOOLCHAIN_FILE=$toolchain"
          cmake --build "$vds\build\windows" --config Release --parallel
          New-Item -ItemType Directory -Force -Path vds-bin, vds-packaging | Out-Null
          foreach ($f in "vdsd.exe", "vdsctl.exe", "opus.dll") {
            Copy-Item "$vds\build\windows\Release\$f" vds-bin\
          }
          Copy-Item "$vds\packaging\windows\install_dependencies.ps1" vds-packaging\
          foreach ($f in "install_service.ps1", "stop_service.ps1", "uninstall_service.ps1") {
            Copy-Item "$vds\$f" vds-packaging\
          }
          $bin = [IO.File]::ReadAllBytes("vds-bin\vdsd.exe")
          if (-not [Text.Encoding]::GetEncoding(28591).GetString($bin).Contains("speaker-muted")) {
            throw "vdsd.exe no trae la modificación del parlante"
          }
          Get-ChildItem vds-bin, vds-packaging | Format-Table Name, Length

      - name: Dependencias de Python
        run: pip install -r app/requirements.txt pyinstaller pytest

      - name: Pruebas en Windows
        run: python -m pytest -v tests

      - name: Empaquetar con PyInstaller
        run: python -m PyInstaller --noconfirm --clean packaging/DualSenseControl.spec

      - name: Autoprueba del .exe en un Windows limpio
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "selftest.json"
          $p = Start-Process dist\DualSenseControl.exe -ArgumentList "--self-test", "`"$out`"" -Wait -PassThru
          Get-Content $out
          if ($p.ExitCode -ne 0) { throw "La autoprueba falló (código $($p.ExitCode))" }

      - name: Huella SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\DualSenseControl.exe -Algorithm SHA256).Hash.ToLower()
          "$h  DualSenseControl.exe" | Out-File -Encoding ascii dist\DualSenseControl.exe.sha256
          Get-Content dist\DualSenseControl.exe.sha256
          "{0:N1} MB" -f ((Get-Item dist\DualSenseControl.exe).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: DualSenseControl
          path: |
            dist/DualSenseControl.exe
            dist/DualSenseControl.exe.sha256

      - name: Adjuntar a la release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
          files: |
            dist/DualSenseControl.exe
            dist/DualSenseControl.exe.sha256
